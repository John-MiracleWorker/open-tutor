name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install -e '.[quantum,subjects,dev]'
      - name: Test backend
        run: python -m pytest -q
      - name: Lint backend
        run: python -m ruff check open_tutor
      - name: Test private launcher guards
        run: python -m unittest discover -s scripts -p test_serve.py

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Test frontend
        run: npm --prefix web test
      - name: Typecheck frontend
        run: npm --prefix web run typecheck
      - name: Build frontend
        run: npm --prefix web run build
